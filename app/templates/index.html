function isNumericCapableSelect(p) {
  if (p.type === "bool" || !p.options) return false;
  if (p.type === "number") return true;
  return p.options.some(o => {
    const v = String(o.value).trim();
    return v !== "" && v !== "auto" && v !== "nut_match" && !isNaN(Number(v));
  });
}

function getNumericFallback(p) {
  if (!isNaN(Number(p.default))) return Number(p.default);
  if (p.options) {
    const numOpt = p.options.find(o => !isNaN(Number(o.value)));
    if (numOpt) return Number(numOpt.value);
  }
  return 1.0;
}

  const setAutoText = (paramName, text) => {

  setAutoText("metric_nut_af",        `Auto — Standard for ${thread}: ${spec.af} Wrench`);
  setAutoText("imperial_nut_af",      `Auto — Standard for ${thread}: ${spec.af} Wrench`);
  setAutoText("metric_allen_size",    `Auto — Standard for ${thread} (${vals.head_type}): ${stdHex} Allen`);
  setAutoText("imperial_allen_size",  `Auto — Standard for ${thread} (${vals.head_type}): ${stdHex} Allen`);
  setAutoText("torx_drive_size",      `Auto — Standard for ${thread}: ${spec.torx} Torx Star`);
  setAutoText("phillips_drive_size",  `Auto — Standard for ${thread}: ${spec.ph} Phillips`);
  setAutoText("slot_width_override",  `Auto — Standard for ${thread}: ${spec.slot} Slot Blade`);

  const tlSel = document.querySelector('select[data-param="thread_len"]');
  if (tlSel) {
    const nmOpt = Array.from(tlSel.options).find(o => o.value === "nut_match");
    if (nmOpt) nmOpt.textContent = `Match Standard ${thread} Nut Thickness (${spec.nut_h} — Flush Back)`;

    <div>• <strong>Allen:</strong> ${spec.s_hex} (Socket) &nbsp;|&nbsp; ${spec.b_hex} (Button/Flat) &nbsp;|&nbsp; <strong>Torx:</strong> ${spec.torx}</div>
    <div class="companion-bar">
      <button class="btn-mini" onclick="quickAddCompanion('nut')">➕ Add Matching ${thread} Nut</button>
      <button class="btn-mini" onclick="quickAddCompanion('washer')">➕ Add ${thread} Washer</button>

// 1-Click Companion Adder (Adds matching Nut, Washer, or Wrench straight to Kit Cart!)
function quickAddCompanion(type) {
  const vals = collectParams();
  const qty = parseInt(document.getElementById("add-qty").value) || 1;
  const thread = (vals.unit_system === "metric") ? vals.metric_size : vals.imperial_size;
  const spec = STD_SPECS[thread];

  if (type === "nut" || type === "washer") {
    const compParams = Object.assign({}, vals, { part_type: type });
    const label = `${thread}_${type === 'nut' ? 'Hex_Nut' : 'Flat_Washer'}`;
    pushToKitCart("01_fasteners.scad", compParams, qty, label);
    setStatus(`🛒 Added ${qty}× ${label} to Kit Cart!`, "#10b981");
  } else if (type === "wrench" && spec) {
    const toolGen = generators.find(g => g.filename === "05_install_tools.scad");
    if (!toolGen) return;
    const toolParams = {};
    toolGen.parameters.forEach(p => toolParams[p.name] = p.default);
    toolParams.tool_category = "wrench_combo";
    toolParams.unit_system = vals.unit_system;
    toolParams.printer_slop = vals.printer_slop || 0.16;
    if (vals.unit_system === "metric") toolParams.metric_wrench_af = spec.af_num;
    else toolParams.imperial_wrench_af = spec.af_num;

    const label = `Wrench_${spec.af.split(' ')[0].replace(/[^a-zA-Z0-9\-\.]/g, '')}_for_${thread}`;
    pushToKitCart("05_install_tools.scad", toolParams, 1, label);
    setStatus(`🛒 Added Matching ${spec.af} Wrench to Kit Cart!`, "#10b981");
  }
}

function summarizeCurrentItem(genFilename, params) {
  const custom = document.getElementById("custom-name").value.trim();
  if (custom) return custom;
  if (genFilename === "01_fasteners.scad") {
    const t = params.unit_system === "metric" ? params.metric_size : params.imperial_size;
    if (params.part_type === "bolt") return `${t}×${params.length}mm_${params.head_type}_${params.drive_type}_Bolt`;
    if (params.part_type === "nut") return `${t}_${params.nut_style}_Nut`;
    if (params.part_type === "washer") return `${t}_Washer`;
    return `${t}×${params.length}mm_Rod`;
  }
  if (genFilename === "02_gears.scad") return `${params.gear_style}_Gear_${params.teeth}T_M${params.mod}`;
  if (genFilename === "03_bearings.scad") return `Bearing_${params.preset}_${params.bearing_type}`;
  if (genFilename === "04_spacers_standoffs.scad") {
    const t = params.unit_system === "metric" ? params.metric_spec : params.imperial_spec;
    return `${params.spacer_type}_${t}×${params.height}mm`;
  }
  if (genFilename === "05_install_tools.scad") return `Tool_${params.tool_category}_${params.tip_type || ''}`;
  return genFilename.replace(".scad", "");
}

function pushToKitCart(generator, params, qty, label) {
  const paramKey = JSON.stringify({ generator, params });
  const existing = kitCart.find(i => i.key === paramKey);
  if (existing) {
    existing.qty += qty;
  } else {
    kitCart.push({ key: paramKey, generator, params, qty, label });
  }
  renderKitCartList();
}

function renderKitCartList() {
  const listEl = document.getElementById("kit-items-list");
  const badgeEl = document.getElementById("kit-count-badge");
  const totalPcs = kitCart.reduce((acc, item) => acc + item.qty, 0);
  badgeEl.textContent = `${totalPcs} pcs`;

  if (kitCart.length === 0) {
    listEl.innerHTML = `<div class="kit-empty">Your kit cart is empty.<br>Add bolts, nuts, washers, or tools to pack them onto a unified build plate!</div>`;
    return;
  }

  listEl.innerHTML = kitCart.map((item, idx) => `
    <div class="kit-item-row">
      <div class="kit-item-title" title="${item.label}">${item.label}</div>
      <input type="number" class="kit-qty-input" min="1" max="100" value="${item.qty}"
        onchange="updateKitItemQty(${idx}, this.value)">
      <button class="btn-del" onclick="removeKitItem(${idx})" title="Remove item">✕</button>
    </div>
  `).join("");
}

function updateKitItemQty(idx, val) {
  const q = parseInt(val);
  if (q > 0) kitCart[idx].qty = q;
  renderKitCartList();
}

function removeKitItem(idx) {
  kitCart.splice(idx, 1);

function initThree() {
  const container = document.getElementById("viewport");
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x121418);

  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.05, 3000);
  camera.position.set(55, -80, 55);
  camera.up.set(0, 0, 1);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const grid = new THREE.GridHelper(200, 20, 0x3b82f6, 0x2e3440);
  grid.rotation.x = Math.PI / 2;
  scene.add(grid);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));

  const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.85);
  dirLight1.position.set(60, -80, 100);
  scene.add(dirLight1);

  const dirLight2 = new THREE.DirectionalLight(0x90b4ff, 0.45);
  dirLight2.position.set(-60, 80, -40);
  scene.add(dirLight2);

  window.addEventListener("resize", () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function onSelectChanged(selEl) {
  const paramName = selEl.dataset.param;
  const customWrap = document.getElementById(`custom-wrap-${paramName}`);
  if (customWrap) {
    if (selEl.value === "__custom__") {
      customWrap.style.display = "flex";
      const inp = customWrap.querySelector("input");
      if (inp) inp.focus();
    } else {
      customWrap.style.display = "none";
      const inp = customWrap.querySelector("input");
      if (inp && !isNaN(Number(selEl.value))) {
        inp.value = selEl.value;
      }
    }
  }
  onControlUpdated();
}

function onControlUpdated() {
  updateVisibility();
  updateAutoLabelsAndCard();
  if (typeof initOrSyncVisualHelpers === 'function') initOrSyncVisualHelpers();
  if (document.getElementById("auto-render").checked) {
    clearTimeout(renderTimeout);
    renderTimeout = setTimeout(() => renderPart(), 180);
  }
}

function onGeneratorChange() {
  const idx = document.getElementById("generator-select").value;
  currentGenerator = generators[idx];
  const container = document.getElementById("controls-container");
  container.innerHTML = "";

  let lastGroup = "";
  currentGenerator.parameters.forEach(p => {
    if (p.group !== lastGroup) {
      const gTitle = document.createElement("div");
      gTitle.className = "group-title";
      gTitle.dataset.group = p.group;
      gTitle.textContent = p.group;
      container.appendChild(gTitle);
      lastGroup = p.group;
    }

    const wrap = document.createElement("div");
    wrap.className = "control-item";
    wrap.id = `wrap-${p.name}`;
    wrap.dataset.groupItem = p.group;

    if (p.ui === "select") {
      const allowCustomNum = isNumericCapableSelect(p);
      let opts = p.options.map(o => {
        const isSel = String(o.value) === String(p.default) ? "selected" : "";
        return `<option value="${o.value}" ${isSel}>${o.label}</option>`;
      }).join("");

      if (allowCustomNum) {
        opts += `<option value="__custom__">✏️ Custom Exact Value (Type Below)...</option>`;
      }

      const fallbackVal = getNumericFallback(p);
      wrap.innerHTML = `
        <label>${p.label}</label>
        <select data-param="${p.name}" onchange="onSelectChanged(this)">${opts}</select>
        ${allowCustomNum ? `
          <div class="custom-num-wrap" id="custom-wrap-${p.name}">
            <span>Exact:</span>
            <input type="text" class="custom-num-input" data-custom-for="${p.name}" value="${fallbackVal}" placeholder="e.g. 87 or 7/8" oninput="onControlUpdated()">
            <select class="custom-unit-select" data-unit-for="${p.name}" onchange="onControlUpdated()" style="width:88px; padding:4px 5px; font-size:0.76rem;">
              <option value="mm">mm</option>
              <option value="in">in (SAE)</option>
            </select>
            <span class="conv-hint" id="conv-hint-${p.name}" style="font-size:0.71rem; color:#10b981;"></span>
          </div>
        ` : ""}
      `;
    } else if (p.ui === "slider") {
      wrap.innerHTML = `
        <label>${p.label}</label>
        <div class="slider-row">
          <input type="range" data-param="${p.name}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.default}"
            oninput="this.nextElementSibling.value = this.value" onchange="onControlUpdated()">
          <input type="number" class="slider-val" step="any" value="${p.default}"
            oninput="this.previousElementSibling.value = this.value; onControlUpdated()">
        </div>`;
    } else {
      wrap.innerHTML = `
        <label>${p.label}</label>
        <input type="${p.type === 'number' ? 'number' : 'text'}" step="any" data-param="${p.name}" value="${p.default}" oninput="onControlUpdated()">`;
    }
    container.appendChild(wrap);
  });

  updateVisibility();
  updateAutoLabelsAndCard();
  if (typeof initOrSyncVisualHelpers === 'function') initOrSyncVisualHelpers();
  renderPart();
}

function collectParams() {
  const params = {};
  currentGenerator.parameters.forEach(p => {
    const el = document.querySelector(`[data-param="${p.name}"]`);
    if (!el) return;

    let rawVal = el.value;
    if (el.tagName === "SELECT" && rawVal === "__custom__") {
      const customInp = document.querySelector(`[data-custom-for="${p.name}"]`);
      const unitSel = document.querySelector(`[data-unit-for="${p.name}"]`);
      const hintEl = document.getElementById(`conv-hint-${p.name}`);
      let txt = (customInp ? customInp.value : "1").trim();

      let num = 0;
      const mixedMatch = txt.match(/^(\d+)[\s\-]+(\d+)\/(\d+)$/);
      const fracMatch  = txt.match(/^(\d+)\/(\d+)$/);
      if (mixedMatch) {
        num = parseFloat(mixedMatch[1]) + (parseFloat(mixedMatch[2]) / parseFloat(mixedMatch[3]));
      } else if (fracMatch) {
        num = parseFloat(fracMatch[1]) / parseFloat(fracMatch[2]);
      } else {
        num = parseFloat(txt);
      }
      if (isNaN(num)) num = 1;

      if (unitSel && unitSel.value === "in") {
        num = num * 25.4;
        if (hintEl) hintEl.textContent = `= ${num.toFixed(2)} mm`;
      } else {
        if (hintEl) hintEl.textContent = `(${(num / 25.4).toFixed(3)}")`;
      }
      rawVal = String(num);
    } else if (p.ui === "slider") {
      const numBox = el.nextElementSibling;
      if (numBox && numBox.value !== "") rawVal = numBox.value;
    }

    if (p.type === "bool") {
      params[p.name] = (rawVal === "true" || el.checked === true);
    } else if (p.type === "number") {
      const parsed = parseFloat(rawVal);
      params[p.name] = isNaN(parsed) ? 0.1 : parsed;
    } else {
      params[p.name] = String(rawVal);
    }
  });
  return params;
}

function updateVisibility() {
  if (!currentGenerator) return;
  const currentVals = collectParams();

  currentGenerator.parameters.forEach(p => {
    const wrap = document.getElementById(`wrap-${p.name}`);
    if (!wrap || !p.show_if) return;

    let visible = true;
    for (const [depKey, allowedList] of Object.entries(p.show_if)) {
      const actualVal = String(currentVals[depKey]);
      if (!allowedList.includes(actualVal)) {
        visible = false;
        break;
      }
    }
    wrap.style.display = visible ? "block" : "none";
  });

  document.querySelectorAll(".group-title").forEach(header => {
    const grp = header.dataset.group;
    const items = Array.from(document.querySelectorAll(`[data-group-item="${grp}"]`));
    const anyVisible = items.some(el => el.style.display !== "none");
    header.style.display = anyVisible ? "block" : "none";
  });
}

function loadSTLIntoViewer(url) {
  const loader = new THREE.STLLoader();
  loader.load(url, (geometry) => {
    if (currentMesh) scene.remove(currentMesh);

    geometry.computeVertexNormals();
    geometry.computeBoundingBox();
    const box = geometry.boundingBox;
    const size = new THREE.Vector3();
    box.getSize(size);

    const center = new THREE.Vector3();
    box.getCenter(center);
    window.lastStlCenterOffset = { x: center.x, y: center.y, z: box.min.z };
    geometry.translate(-center.x, -center.y, -box.min.z);

    const material = new THREE.MeshStandardMaterial({
      color: 0x3b82f6, roughness: 0.35, metalness: 0.15, side: THREE.DoubleSide
    });
    currentMesh = new THREE.Mesh(geometry, material);
    scene.add(currentMesh);

    document.getElementById("dimensions-box").textContent =
      `Dimensions: ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)} mm`;
  });
}

  window.location.href = `orcaslicer://open?file=${encodeURIComponent(fileUrl)}`;
  setTimeout(() => {
    window.location.href = `/api/preview.stl?download_name=${encodeURIComponent(fname)}`;
  }, 350);
  setStatus(`🚀 Sent ${fname} to OrcaSlicer!`, "#10b981");
}

async function openInOrcaSlicer() {
  if (kitCart.length === 0) {
    // If Kit Cart is empty, automatically slice the currently previewed single part instead of doing nothing!
    await openSingleInOrca();
    return;
  }
  setStatus("⏳ Packing Multi-Object .3MF Kit for OrcaSlicer...", "#f59e0b");
  await renderKitPlate();
  const kName = (document.getElementById("kit-name").value.trim() || "Hardware_Kit").replace(/[^a-zA-Z0-9_\-]/g, "_") + ".3mf";
  const fileUrl = `${window.location.origin}/api/kit_multi_object.3mf?download_name=${encodeURIComponent(kName)}`;
  window.location.href = `orcaslicer://open?file=${encodeURIComponent(fileUrl)}`;
  setTimeout(() => {
    window.location.href = `/api/kit_multi_object.3mf?download_name=${encodeURIComponent(kName)}`;
  }, 350);
  setStatus(`🚀 Sent ${kName} to OrcaSlicer!`, "#10b981");
}

let savedPresets = [];
async function refreshPresetsDropdown() {
  const res = await fetch("/api/presets");
  savedPresets = await res.json();
  const sel = document.getElementById("preset-select");
  if (!sel) return;
  sel.innerHTML = `<option value="">💾 Saved Part / Kit Presets (${savedPresets.length})...</option>` +
    savedPresets.map((p, i) => `<option value="${i}">[${p.preset_type.toUpperCase()}] ${p.name}</option>`).join("");
}

async function promptSavePreset(type) {
  const name = prompt(`Enter a name to save this ${type === 'kit' ? 'Kit Recipe' : 'Part Preset'}:`);
  if (!name || !name.trim()) return;
  const payload = {
    name: name.trim(),
    preset_type: type,
    generator: currentGenerator ? currentGenerator.filename : "",
    params: collectParams(),
    items: type === "kit" ? kitCart : []
  };
  await fetch("/api/presets", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  await refreshPresetsDropdown();
  setStatus(`💾 Saved ${type} preset: "${name.trim()}"`, "#10b981");
}

function loadSelectedPreset() {
  const sel = document.getElementById("preset-select");
  if (!sel || sel.value === "") return;
  const preset = savedPresets[parseInt(sel.value)];
  if (!preset) return;

  if (preset.preset_type === "kit") {
    kitCart = JSON.parse(JSON.stringify(preset.items || []));
    document.getElementById("kit-name").value = preset.name;
    renderKitCartList();
    renderKitPlate();
  } else {
    const genIdx = generators.findIndex(g => g.filename === preset.generator);
    if (genIdx >= 0) {
      document.getElementById("generator-select").value = genIdx;
      onGeneratorChange();
      setTimeout(() => {
        for (const [k, v] of Object.entries(preset.params || {})) {
          const el = document.querySelector(`[data-param="${k}"]`);
          if (el) el.value = String(v);
        }
        onControlUpdated();
      }, 60);
    }
  }
}

async function deleteCurrentPreset() {
  const sel = document.getElementById("preset-select");
  if (!sel || sel.value === "") return;
  const preset = savedPresets[parseInt(sel.value)];
  if (!preset) return;
  await fetch(`/api/presets/${encodeURIComponent(preset.name)}`, { method: "DELETE" });
  await refreshPresetsDropdown();
  setStatus(`🗑️ Deleted preset "${preset.name}"`, "#f59e0b");
}

loadGenerators();
refreshPresetsDropdown();
try { initThree(); } catch(e) { console.error(e); }
</script>
